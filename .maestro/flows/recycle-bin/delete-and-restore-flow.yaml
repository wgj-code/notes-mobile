appId: com.wgjcode.notes
env:
  NOTE_TITLE: "E2E RecycleBin Test"
  NOTE_BODY: "To be deleted and restored"
---
- launchApp:
    stopApp: false
# 注意：需要手动打开 app 并确保在笔记列表页
- extendedWaitUntil:
    visible:
      id: "fab-create"
    timeout: 15000

# 创建笔记
- tapOn:
    id: "fab-create"
- extendedWaitUntil:
    visible: "空白笔记"
    timeout: 10000
- tapOn: "空白笔记"
- extendedWaitUntil:
    visible:
      id: "note-title-input"
    timeout: 10000
- tapOn:
    id: "note-title-input"
- inputText: ${NOTE_TITLE}
- tapOn:
    id: "note-content-editor"
- inputText: ${NOTE_BODY}
- tapOn:
    id: "btn-save"
- extendedWaitUntil:
    visible: ${NOTE_TITLE}
    timeout: 10000

# 删除
- tapOn: ${NOTE_TITLE}
- extendedWaitUntil:
    visible: "删除"
    timeout: 10000
- tapOn:
    id: "btn-delete"
- tapOn: "删除"
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible: ${NOTE_TITLE}
    timeout: 15000
- assertNotVisible: ${NOTE_TITLE}

# 打开回收站
- tapOn:
    id: "btn-recycle-bin"
- extendedWaitUntil:
    visible: ${NOTE_TITLE}
    timeout: 10000
- assertVisible: ${NOTE_TITLE}

# 恢复
- tapOn:
    id: "btn-restore"
- extendedWaitUntil:
    visible: "恢复"
    timeout: 5000
- tapOn: "恢复"
# 关闭"笔记已恢复"弹窗
- extendedWaitUntil:
    visible: "OK"
    timeout: 5000
- tapOn: "OK"
- extendedWaitUntil:
    notVisible: ${NOTE_TITLE}
    timeout: 10000

# 返回列表验证
- back
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ${NOTE_TITLE}
    timeout: 10000
- assertVisible: ${NOTE_TITLE}

# 清理
- tapOn: ${NOTE_TITLE}
- extendedWaitUntil:
    visible: "删除"
    timeout: 10000
- tapOn:
    id: "btn-delete"
- tapOn: "删除"
