appId: com.wgjcode.notes
env:
  NOTE_TITLE: "E2E CRUD Test"
  NOTE_BODY: "Test note body"
  EDITED_BODY: "Edited content"
---
- launchApp:
    stopApp: false
# 注意：需要手动打开 app 并确保在笔记列表页
- extendedWaitUntil:
    visible:
      id: "fab-create"
    timeout: 15000

# 新建笔记
- tapOn:
    id: "fab-create"
- extendedWaitUntil:
    visible: "空白笔记"
    timeout: 10000
- tapOn: "空白笔记"
- extendedWaitUntil:
    visible:
      id: "note-title-input"
    timeout: 10000
- tapOn:
    id: "note-title-input"
- inputText: ${NOTE_TITLE}
- tapOn:
    id: "note-content-editor"
- inputText: ${NOTE_BODY}
- tapOn:
    id: "btn-save"

# 验证列表可见
- extendedWaitUntil:
    visible: ${NOTE_TITLE}
    timeout: 10000
- assertVisible: ${NOTE_TITLE}

# 打开详情
- tapOn: ${NOTE_TITLE}
- extendedWaitUntil:
    visible: "编辑"
    timeout: 10000
# 切换到编辑模式
- tapOn: "编辑"
- extendedWaitUntil:
    visible:
      id: "note-title-input"
    timeout: 10000
- assertVisible: ${NOTE_BODY}

# 编辑
- tapOn:
    id: "note-content-editor"
- eraseText: 100
- inputText: ${EDITED_BODY}
- tapOn:
    id: "btn-save"

# 验证编辑后
- extendedWaitUntil:
    visible: ${NOTE_TITLE}
    timeout: 10000
- tapOn: ${NOTE_TITLE}
- assertVisible: ${EDITED_BODY}

# 删除
- tapOn:
    id: "btn-delete"
- tapOn: "删除"
# 等待删除完成+列表刷新
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible: ${NOTE_TITLE}
    timeout: 15000
- assertNotVisible: ${NOTE_TITLE}
