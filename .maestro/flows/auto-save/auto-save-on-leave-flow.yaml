appId: com.wgjcode.notes
env:
  NOTE_TITLE: "E2E AutoSave Test"
  INITIAL_BODY: "Initial content"
  EDITED_BODY: "Auto-saved content"
---
- launchApp:
    clearState: true
- launchApp

- extendedWaitUntil:
    visible:
      id: "fab-create"
    timeout: 15000

# 创建笔记
- tapOn:
    id: "fab-create"
- extendedWaitUntil:
    visible:
      id: "note-title-input"
    timeout: 10000
- tapOn:
    id: "note-title-input"
- inputText: ${NOTE_TITLE}
- tapOn:
    id: "note-content-editor"
- inputText: ${INITIAL_BODY}
- tapOn:
    id: "btn-save"
- extendedWaitUntil:
    visible: ${NOTE_TITLE}
    timeout: 10000

# 打开编辑
- tapOn: ${NOTE_TITLE}
- extendedWaitUntil:
    visible:
      id: "note-content-editor"
    timeout: 10000

# 编辑内容（不点保存）
- tapOn:
    id: "note-content-editor"
- eraseText: 50
- inputText: ${EDITED_BODY}

# 通过 back 离开（不保存）
- back

# 重新打开验证自动保存
- extendedWaitUntil:
    visible: ${NOTE_TITLE}
    timeout: 10000
- tapOn: ${NOTE_TITLE}
- extendedWaitUntil:
    visible: ${EDITED_BODY}
    timeout: 10000
- assertVisible: ${EDITED_BODY}

# 清理
- back
- tapOn: ${NOTE_TITLE}
- tapOn:
    id: "btn-delete"
- tapOn: "确认"
