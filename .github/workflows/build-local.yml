# B-015: Mobile 本地构建 CI/CD
# 不依赖 EAS，使用 GitHub Actions runner 本地构建 APK
# 增量策略：缓存 node_modules + .gradle + build 目录

name: Build Android APK (Local)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'scripts/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --legacy-peer-deps
      - run: npx jest --forceExit --detectOpenHandles --testPathIgnorePatterns='offline\.test|sync\.test'

  build:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # 增量策略：缓存 Gradle 构建目录（不缓存 node_modules，确保 postinstall 补丁执行）
      - uses: actions/cache@v4
        with:
          path: |
            android/.gradle
            android/app/build
          key: android-gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            android-gradle-${{ runner.os }}-

      - run: npm install --legacy-peer-deps

      # 从 GitHub Secrets 生成 .env 文件（构建时注入到 APK）
      - name: Create .env from secrets
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "Created .env with $(grep -c EXPO_PUBLIC .env) vars"

      # 复用现有构建脚本（增量构建）
      - name: Build debug APK (slim)
        run: bash scripts/build-debug-apk.sh --slim

      # 上传 APK 产物
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
